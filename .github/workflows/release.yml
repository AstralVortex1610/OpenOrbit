name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fetch the offline "Hey Orbit" wake-word model
        shell: bash
        run: |
          curl -sSL -o vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk.zip
          tar czf assets/vosk-model-small-en-us-0.15.tar.gz vosk-model-small-en-us-0.15
          rm -rf vosk.zip vosk-model-small-en-us-0.15
      - run: node build/bundle-voice.js
      - run: npx electron-builder --win zip --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          make_latest: true
          body: |
            **Orbit is in beta.** Expect rough edges, and please open an issue when something breaks.

            **Install:** download `Orbit-*-win.zip`, unzip it, and run `Orbit.exe`. If SmartScreen shows a warning, click **More info → Run anyway**. Then open Settings → Brain and add your model.

            **New in this release:** Orbit talks first. It opens a voice call by itself, greets you, and checks in when things go quiet. There's a new on-device voice (Phonon), and Settings → Live voice has a voice check you can run.

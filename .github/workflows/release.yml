name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fetch the offline "Hey Orbit" wake-word model
        shell: bash
        run: |
          curl -sSL -o vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk.zip
          tar czf assets/vosk-model-small-en-us-0.15.tar.gz vosk-model-small-en-us-0.15
          rm -rf vosk.zip vosk-model-small-en-us-0.15
      - run: node build/bundle-voice.js
      - run: npx electron-builder --win zip --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          make_latest: true
          body_path: docs/releases/${{ github.ref_name }}.md

<!doctype html>
<html lang="en" data-theme="orbit-dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Orbiter</title>
  <link rel="stylesheet" href="orbiter.css" />
</head>
<body>
  <header class="tb">
    <div class="tb-brand"><img src="mark.png" alt="" /><b>Orbiter</b><span class="beta">beta</span></div>
    <div class="tb-sess" id="tbSess"></div>
    <div class="tb-win">
      <button data-w="min" title="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button data-w="max" title="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
      <button data-w="close" class="x" title="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </header>

  <div class="app">
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>
    <!-- Sessions -->
    <aside class="side">
      <button class="new" id="newBtn"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>New session<kbd>Ctrl N</kbd></button>
      <div class="side-label">Sessions</div>
      <div class="sess-list" id="sessList"></div>
      <div class="side-foot">
        <button id="themeBtn" class="foot-btn"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5z" fill="currentColor"/></svg><span id="themeName">Theme</span></button>
        <button id="setBtn" class="foot-btn"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>Settings</button>
      </div>
    </aside>

    <!-- Conversation -->
    <main class="main">
      <div class="feed" id="feed"></div>
      <div class="composer-wrap">
        <div class="slash" id="slash" hidden></div>
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask Orbiter to build, fix or explain…  ( / for commands, @ for files )"></textarea>
          <div class="crow">
            <button class="chip mode" id="modeChip" title="Permission mode (Shift+Tab)"><i></i><span></span></button>
            <button class="chip" id="tierChip" title="Model tier"><svg viewBox="0 0 16 16"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/></svg><span></span></button>
            <button class="chip ghost" id="folderChip" title="Working folder"><svg viewBox="0 0 16 16"><path d="M2 4.5A1 1 0 0 1 3 3.5h3l1.2 1.3H13a1 1 0 0 1 1 1v6.2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg><span></span></button>
            <div class="grow"></div>
            <span class="ctx" id="ctxMeter" title="Tokens used by this session"></span>
            <button class="send" id="sendBtn" title="Send (Enter)"><svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
          </div>
        </div>
        <div class="hint" id="hint">Shift+Tab mode · Esc stop · Esc Esc rewind · / commands</div>
      </div>
    </main>

    <!-- Right pane -->
    <aside class="pane">
      <div class="tabs" id="tabs">
        <button data-t="todo" class="on">Tasks</button>
        <button data-t="changes">Changes</button>
        <button data-t="checkpoints">Checkpoints</button>
      </div>
      <div class="pane-body" id="paneBody"></div>
    </aside>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <script src="markdown.js"></script>
  <script src="orbiter-backdrops.js"></script>
  <script src="orbiter.js"></script>
</body>
</html>
